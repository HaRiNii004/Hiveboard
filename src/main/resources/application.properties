spring.application.name=hiveboard

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/hiveboard_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# update: auto-adjusts tables to match your entities. Fine for dev, NOT for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Generate your own long random string for real use, e.g: openssl rand -base64 64
jwt.secret=change-this-to-a-long-random-secret-string-before-going-any-further-1234567890
jwt.expiration-ms=86400000

server.port=8080
