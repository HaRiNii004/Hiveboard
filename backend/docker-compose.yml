# Project name fixed to "hiveboard": the database container and its data volume
# (hiveboard_pgdata) were created under that name, so Compose must keep using it
# no matter which folder it's run from.
name: hiveboard

services:
  postgres:
    image: postgres:latest
    container_name: hiveboard-postgres
    environment:
      POSTGRES_DB: hiveboard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # Local mail catcher: the backend sends real emails (password reset links) here
  # instead of to real inboxes. Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: hiveboard-mailpit
    ports:
      - "1025:1025" # SMTP (backend/mail.properties)
      - "8025:8025" # web inbox
    restart: unless-stopped

volumes:
  pgdata:
