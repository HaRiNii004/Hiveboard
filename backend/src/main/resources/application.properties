spring.application.name=hiveboard

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5433/hiveboard_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# update: auto-adjusts tables to match your entities. Fine for dev, NOT for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Generate your own long random string for real use, e.g: openssl rand -base64 64
jwt.secret=cQU/ZIToPX+5DpIHvAA+etmKElaSW3BI5rX9zJtHwjc=
jwt.expiration-ms=86400000
# "Remember me" logins last 30 days
jwt.remember-me-expiration-ms=2592000000

server.port=8081

# --- Invitations ---
# Base URL of the frontend, used to build invite links (http://.../invite/<token>)
app.frontend-url=http://localhost:5173

# --- Email (password reset links) ---
# The mail server settings live in backend/mail.properties, which git ignores so passwords
# are never committed (see mail.properties.example: Mailpit for local testing, or Gmail).
# Without them, emails are written to the backend console instead of being sent.
spring.config.import=optional:file:./mail.properties,optional:file:./backend/mail.properties

# --- Rate limiting (per IP, per endpoint, on login / sign-up / password reset) ---
app.rate-limit.enabled=true
app.rate-limit.window=1m
app.rate-limit.limits.login=10
app.rate-limit.limits.register=5
app.rate-limit.limits.forgot-password=5
app.rate-limit.limits.reset-password=10
app.rate-limit.limits.google=10
# Only behind a proxy you control that sets X-Forwarded-For (otherwise IPs can be faked)
app.rate-limit.trust-forwarded-for=false

# --- Housekeeping (expired reset links, rate-limit counters) ---
app.cleanup.interval=PT1H

# --- Continue with Google ---
# Create an OAuth client (type "Web application") at https://console.cloud.google.com/apis/credentials
# and add http://localhost:5173 under "Authorized JavaScript origins".
# Leave these empty to hide the Google button.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
