spring.application.name=hiveboard

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5433/hiveboard_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# update: auto-adjusts tables to match your entities. Fine for dev, NOT for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Generate your own long random string for real use, e.g: openssl rand -base64 64
jwt.secret=cQU/ZIToPX+5DpIHvAA+etmKElaSW3BI5rX9zJtHwjc=
jwt.expiration-ms=86400000

server.port=8081

# --- Invitations ---
# Base URL of the frontend, used to build invite links (http://.../invite/<token>)
app.frontend-url=http://localhost:5173
